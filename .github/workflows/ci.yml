name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Public repository guard
        run: node scripts/check-public-repo.mjs
      - name: TypeScript production-core compile
        run: npx tsc --noEmit
